[project]
name = "longitrack-napari"
version = "0.1.0"
description = "Interactive napari viewer for point-prompted longitudinal lesion tracking with LongiSeg."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.13"
authors = [
    { name = "Yannick Kirchhoff", email = "yannick.kirchhoff@dkfz-heidelberg.de" },
]
keywords = [
    "napari",
    "longitudinal",
    "lesion tracking",
    "medical image segmentation",
    "LongiSeg",
    "nnU-Net",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: napari",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    # viewer
    "napari[all]>=0.5.0",
    "qtpy>=2.4",
    "superqt>=0.6",
    # GPU inference/registration process, see [tool.uv.sources] below
    "longitrack-backend",
    # io / numerics
    "SimpleITK>=2.2.1",
    "numpy>=1.24",
    "cryptography>=44",
]

[project.optional-dependencies]
# running the backend locally -- torch and LongiSeg. Opt-in, so a remote-only clone stays
# remote-only: `uv run` installs no extras, and never removes ones that are there.
local = [
    "longitrack-backend[gpu]",
]
dev = [
    "longitrack-napari[local]",
    "pytest>=8",
    "pytest-qt>=4.4",
    "ruff>=0.6",
]

[project.urls]
homepage = "https://github.com/MIC-DKFZ/LongiTrack-napari"
repository = "https://github.com/MIC-DKFZ/LongiTrack-napari"
"LongiTrack-backend" = "https://github.com/MIC-DKFZ/LongiTrack-backend"

[project.scripts]
longitrack-napari = "longitrack_napari.app:main"

[project.entry-points."napari.manifest"]
longitrack-napari = "longitrack_napari:napari.yaml"

# --- uv -----------------------------------------------------------------------
# Not on PyPI, so it comes from its GitHub remote; it brings its own sources with it.
# To work against a local clone instead, run
#     uv sync && uv pip install -e ../LongiTrack-backend
[tool.uv.sources]
longitrack-backend = { git = "https://github.com/MIC-DKFZ/LongiTrack-backend.git", tag = "v0.1.0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/longitrack_napari"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
